version: "3.9"

services:
  misho:
    env_file: ".env"
    environment:
      - TZ=Europe/Berlin
    image: mojo28/misho
    build:
      context: .
      dockerfile: ./misho-server/Dockerfile
      args:
        MISHO_ENVIRONMENT: ${MISHO_ENVIRONMENT}
    volumes:
      - ./db:/root/db
    ports:
      - "8000:8000"
